<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欧气卡铺</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
<!-- Five pages, all in the DOM; src/ui/layout.ts shows one per URL hash (#open #shelf #case #luck #grow #ach; #case is 货柜's second view) so switching never loses state (DESIGN.md「布局」).
     The nav sits in the top bar on wide screens and docks to the bottom on phones. -->
<header class="top">
  <h1 class="brand">欧气卡铺</h1>
  <nav class="nav" aria-label="页面">
    <a href="#open">开包</a>
    <a href="#shelf">货柜<b class="tab-n tab-dot" id="shelf-n" hidden></b></a>
    <a href="#luck">欧气<b class="tab-n tab-dot" id="luck-n" hidden></b></a>
    <a href="#grow">成长<b class="tab-n" id="grow-n" hidden></b></a>
    <a href="#ach">成就<b class="tab-n tab-dot" id="ach-n" hidden></b></a>
  </nav>
  <a class="due" id="due" href="#grow" hidden></a>
  <div class="stats" id="stats"></div>
</header>
<div class="pops" id="pops"><div class="notice" id="notice" role="status" hidden></div><div class="slip" id="slip" role="status" hidden></div><div class="memo" id="memo" role="status" hidden></div><div class="ach-pop" id="ach-pop" role="status" hidden></div></div>
<main>
  <section class="page page-open" id="page-open" aria-label="开包">
    <section class="mat" id="mat" aria-live="polite"></section>
    <aside class="rail">
      <section id="rail"></section>
    </aside>
  </section>
  <!-- 货柜 has two views by product line, each with its own half of the customers next to the controls they call for:
       #shelf 货架 (packs: shelf wall + set table | walk-ins for packs · clerk + shop log) and #case 展示柜 (case + singles | case browsers).
       All panels stay direct children of the page; data-view says which view shows it (layout.ts sets <html data-page>). -->
  <section class="page page-shelf" id="page-shelf" aria-label="货柜" hidden>
    <div class="views">
      <nav class="subnav" aria-label="货柜">
        <a href="#shelf">货架<span class="sub-k">&nbsp;· 整包</span><b class="tab-n tab-dot" id="n-packs" hidden></b></a>
        <a href="#case">展示柜<span class="sub-k">&nbsp;· 单卡</span><b class="tab-n tab-dot" id="n-case" hidden></b></a>
      </nav>
      <p class="cust-head" id="cust-head"></p>
      <div class="floor" id="floor" aria-hidden="true"></div>
    </div>
    <section class="shelf" data-view="shelf" aria-labelledby="shelf-h">
      <h2 id="shelf-h">货架 · 进货</h2>
      <div id="shelf"></div>
    </section>
    <div class="col" data-view="shelf">
      <section id="customers"></section>
    </div>
    <div class="col" data-view="shelf">
      <section id="clerk"></section>
      <section><h2>店内动态</h2><ol class="log" id="log"></ol></section>
    </div>
    <div class="col" data-view="case">
      <section id="casepanel"></section>
      <section id="singles"></section>
    </div>
    <div class="col" data-view="case">
      <section id="case-cust"></section>
    </div>
  </section>
  <section class="page page-luck" id="page-luck" aria-label="欧气" hidden>
    <div class="col">
      <section id="luck" aria-labelledby="luck-h"></section>
    </div>
    <section id="dex" aria-label="卡册"></section>
  </section>
  <section class="page page-grow" id="page-grow" aria-label="成长" hidden>
    <section class="ledger" id="ledger" aria-label="账本"></section>
    <div class="grow-top" id="grow-top"></div>
    <section id="upgrades"></section>
    <section class="branch" id="branch"></section>
  </section>
  <section class="page page-ach" id="page-ach" aria-label="成就" hidden>
    <section id="achs"></section>
  </section>
</main>
<dialog class="story" id="story" aria-label="剧情"></dialog>
<dialog class="wreck" id="wreck" aria-label="破产结算"></dialog>
<div class="sound" id="sound" popover aria-label="声音"></div>
<div class="coach" id="coach" popover="manual" role="dialog" aria-label="新手引导"></div>
<div class="raise" id="raise" popover="manual" role="dialog" aria-label="凑钱"></div>
<footer class="foot">
  <details><summary>数据来源与游戏设定</summary><div id="sources"></div></details>
  <details class="basis" id="basis"></details>
  <button class="ghost" id="sound-btn" type="button" popovertarget="sound">声音</button>
  <button class="ghost" data-act="story" type="button">开场剧情</button>
  <button class="ghost" data-act="guide" type="button">新手引导</button>
  <button class="ghost" id="reset" data-act="reset" type="button">清空存档</button>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
